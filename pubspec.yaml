name: shoyo
description: "Save files from the Android Share Sheet to local storage."
publish_to: 'none'

version: 1.1.1+6

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  dynamic_color: ^2.1.0
  flutter_sharing_intent: ^2.0.4
  material_ui: ^1.6.0
  path: ^1.9.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/graphics/icon.png"

flutter:
  uses-material-design: true
